<html>
    <head>
       <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="app-header">
            <h2>Jimmy's Diner</h2>
            <p>The best burgers and pizzas in town</p>
        </header>

        <main class="app-main" id="app-main">
            <section class="main-menu" id="main-menu">

            </section>

            <section class="cart" id="cart">
                <p class="cart-header">Your order</p>
                <div class="cart-item">
                    <div class="cart-text">
                    <p>Pizza</p>
                    <p role="button" class="remove-btn">remove</p>
                    </div>
                    <p class="cart-price">$14</p>
                </div> <hr>

                <div class="cart-total" id="cart-total">
                    <p>Total Price: </p>
                    <p class="cart-price">$14</p>
                </div>
                <button class="cart-button" id="cart-button">Complete order</button>
            </section>
        </main>


	<script src="Ordering.js" type="module"></script>
    </body>
