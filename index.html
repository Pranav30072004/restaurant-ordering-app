<html>
    <head>
       <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="app-header">
            <h2>Jimmy's Diner</h2>
            <p>The best burgers and pizzas in town</p>
        </header>

        <main class="app-main" id="app-main">
            <section class="main-menu" id="main-menu">

            </section>

            <section class="cart" id="cart">
                <p class="cart-header">Your order</p>
                <div id="item-container"></div>
                <hr>

                <div class="cart-total" id="cart-total">
                    <p>Total Price: </p>
                    <p class="cart-price" id="total-price"></p>
                </div>
                <button class="order-btn" id="order-btn">Complete order</button>
            </section>
        </main>

        <section class="payment-modal" id="payment-modal">
            <p>Enter card details</p>
            <form class="card-form" id="card-form">
                <input type="text"
                       class="payment-details"
                       id="holder-name"
                       name="Name"
                       placeholder="Enter your name"
                       aria-label="Enter your name"
                       required
                />
                <input type="number"
                       class="payment-details"
                       id="card-number"
                       name="cardNumber"
                       minlength="13"
                       maxlength="19"
                       placeholder="Enter card number"
                       aria-label="Enter card number"
                       required
                />
                <input type="number"
                       class="payment-details"
                       minlength="3"
                       maxlength="3"
                       id="card-cvv"
                       naem="cardCVV"
                       placeholder="Enter CVV"
                       aria-label="Enter CVV"
                       required
                />
                <button class="pay-btn" id="pay-btn">Pay</button>
            </form>

        </section>


	<script src="Ordering.js" type="module"></script>
    </body>
</html>
